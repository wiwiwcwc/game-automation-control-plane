name: 功能建议
description: 建议新的工作流、集成或界面改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题
      description: 请先描述实际使用场景，而不只是实现方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: upstream
    attributes:
      label: 上游接口依据
      description: 如果涉及外部自动化工具，请提供官方文档或仓库链接及版本。
  - type: textarea
    id: alternatives
    attributes:
      label: 可接受的替代方案
