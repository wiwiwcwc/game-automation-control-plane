name: Windows package proof

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install test and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,build]" -c packaging\constraints.txt

      - name: Run full test suite
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m pytest

      - name: Build Windows onedir package
        shell: pwsh
        run: .\packaging\build_windows.ps1 -PythonExecutable python

      - name: Inspect package contents
        shell: pwsh
        run: |
          $package = (Resolve-Path "dist\GameAutomationControlPlane").Path
          $exe = Join-Path $package "GameAutomationControlPlane.exe"
          $migration = Join-Path $package "_internal\game_control_plane\persistence\migrations\001_initial.sql"
          $pngIcon = Join-Path $package "_internal\game_control_plane\assets\app_icon.png"
          $icoIcon = Join-Path $package "_internal\game_control_plane\assets\app_icon.ico"
          $notice = Join-Path $package "THIRD_PARTY_NOTICES.md"
          $projectLicense = Join-Path $package "LICENSE"
          $lgpl = Join-Path $package "licenses\LGPL-3.0-only.txt"
          $gpl = Join-Path $package "licenses\GPL-3.0-only.txt"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "Packaged executable is missing: $exe" }
          if (-not (Test-Path -LiteralPath $migration -PathType Leaf)) { throw "SQL migration is missing: $migration" }
          if (-not (Test-Path -LiteralPath $pngIcon -PathType Leaf)) { throw "PNG icon is missing: $pngIcon" }
          if (-not (Test-Path -LiteralPath $icoIcon -PathType Leaf)) { throw "ICO icon is missing: $icoIcon" }
          if (-not (Test-Path -LiteralPath $notice -PathType Leaf)) { throw "Third-party notice is missing: $notice" }
          if (-not (Test-Path -LiteralPath $projectLicense -PathType Leaf)) { throw "Project license is missing: $projectLicense" }
          if (-not (Test-Path -LiteralPath $lgpl -PathType Leaf)) { throw "LGPL license is missing: $lgpl" }
          if (-not (Test-Path -LiteralPath $gpl -PathType Leaf)) { throw "GPL license is missing: $gpl" }
          if (-not (Get-ChildItem -LiteralPath $package -Filter "qwindows.dll" -Recurse -File)) { throw "Qt Windows platform plugin is missing." }
          if (Test-Path -LiteralPath (Join-Path $package "_internal\icuuc.dll")) { throw "Unexpected foreign ICU library in package root." }
          foreach ($forbidden in @("tests", ".git", ".venv", "pyproject.toml")) {
            if (Test-Path -LiteralPath (Join-Path $package $forbidden)) { throw "Unexpected development payload: $forbidden" }
          }
          $forbiddenSegments = @("build", "dist", "tests", "codex-runtimes")
          foreach ($entry in Get-ChildItem -LiteralPath $package -Recurse -Force) {
            $relative = $entry.FullName.Substring($package.Length).TrimStart('\', '/')
            $segments = $relative -split '[\\/]'
            if ($segments | Where-Object { $forbiddenSegments -contains $_.ToLowerInvariant() }) {
              throw "Unexpected development/runtime payload: $relative"
            }
          }

      - name: Smoke-launch packaged executable
        shell: pwsh
        run: .\packaging\smoke_test.ps1 -ExecutablePath .\dist\GameAutomationControlPlane\GameAutomationControlPlane.exe -DataDirectory (Join-Path $env:RUNNER_TEMP "game-control-plane-smoke")

      - name: Zip onedir package
        shell: pwsh
        run: |
          $zip = "dist\GameAutomationControlPlane-windows.zip"
          Compress-Archive -Path dist\GameAutomationControlPlane -DestinationPath $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  GameAutomationControlPlane-windows.zip" | Set-Content -Encoding ascii "$zip.sha256"

      - name: Install verified Inno Setup compiler
        shell: pwsh
        run: |
          $iscc = & .\packaging\install_inno_setup.ps1 `
            -InstallDirectory (Join-Path $env:RUNNER_TEMP "InnoSetup-7.1.0") `
            -DownloadDirectory (Join-Path $env:RUNNER_TEMP "InnoSetup-download") | Select-Object -Last 1
          if (-not $iscc -or -not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            throw "Verified Inno Setup bootstrap did not return ISCC.exe: $iscc"
          }
          "HSIESTA_ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Hsiesta installer
        shell: pwsh
        run: .\packaging\build_installer.ps1 -IsccPath $env:HSIESTA_ISCC_PATH

      - name: Smoke installer install and uninstall
        shell: pwsh
        run: |
          $metadata = Get-Content -Raw pyproject.toml
          $versionMatch = [regex]::Match($metadata, '(?m)^\s*version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"\s*$')
          if (-not $versionMatch.Success) { throw "Unable to read project version for installer smoke." }
          $installer = "dist\Hsiesta-$($versionMatch.Groups[1].Value)-Setup.exe"
          # The app's existing PE manifest requests elevation. The onedir EXE
          # was already smoke-tested above; keep this CI smoke non-interactive
          # while still proving install, shortcuts, payload, and data-safe uninstall.
          .\packaging\installer_smoke_test.ps1 -InstallerPath $installer -SkipPackagedSmoke

      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: GameAutomationControlPlane-windows
          path: |
            dist/GameAutomationControlPlane-windows.zip
            dist/GameAutomationControlPlane-windows.zip.sha256
            dist/Hsiesta-*-Setup.exe
            dist/Hsiesta-*-Setup.exe.sha256
