[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "game-automation-control-plane"
version = "0.1.16"
description = "Hsiesta (休汐), a Windows desktop console for mobile-game daily tasks"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"

classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "PySide6>=6.7,<7",
    "tzdata>=2024.1",
]

[project.urls]
Homepage = "https://github.com/wiwiwcwc/hsiesta"
Repository = "https://github.com/wiwiwcwc/hsiesta"
Issues = "https://github.com/wiwiwcwc/hsiesta/issues"

[project.optional-dependencies]
test = ["pytest>=8.0"]
build = ["pyinstaller==6.16.0"]

[project.scripts]
game-control-plane = "game_control_plane.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
game_control_plane = ["persistence/migrations/*.sql", "assets/*.png", "assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
